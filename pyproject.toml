[project]
name = "vfsbench"
version = "0.1.0a0"
description = "Run and verify VFS-Bench tasks with Mirage Python and Harbor"
readme = "docs/vfsbench.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3.9,<4",
    "huggingface-hub>=1,<2",
    "jsonschema>=4.18,<5",
    "mcp>=2.3,<3",
    "mirage-ai[email,ssh,monty]==0.1.0",
    "nodejs-wheel-binaries==24.19.0",
    "openpyxl>=3.1,<4",
    "PyYAML>=6,<7",
    "referencing>=0.30,<1",
]

[project.optional-dependencies]
harbor = ["harbor==0.25.0"]

[project.scripts]
vfsbench = "vfsbench.cli:main"
vfsbench-harbor = "vfsbench.harbor.export:main"

[project.urls]
Repository = "https://github.com/agentvfs/vfs-bench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vfsbench"]

[tool.hatch.build.targets.sdist]
only-include = ["vfsbench", "pyproject.toml", "docs/vfsbench.md", "LICENSE"]
