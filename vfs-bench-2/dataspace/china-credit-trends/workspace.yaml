# DataSpace task_35. Upstream's smolagents harness paths: the task context
# read-only at /workspace, the answer written to /output/prediction.csv.
mode: exec
runtimes:
  - name: pyodide
    config:
      lock_file_url: ${PYTHON_PACKAGES}/pyodide-lock.json
      package_base_url: ${PYTHON_PACKAGES}/
      max_memory: 2G
  - workspace
mounts:
  /workspace:
    vfs: disk
    mode: read
    config:
      root: ${DATASPACE_CONTEXT}
  /output:
    vfs: disk
    mode: write
    config:
      root: ${DATASPACE_OUTPUT}
  /opt/dataspace:
    vfs: disk
    mode: read
    config:
      root: ${DATASPACE_WORKBENCH}
