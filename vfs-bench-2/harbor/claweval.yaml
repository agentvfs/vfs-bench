# All 126 Claw-Eval tasks, graded in a separate Mirage/Pyodide workspace.
# No verifier microVM or Linux site-packages are required. After upstream
# setup and installing Mirage dependencies:
#   uv run --project harbor python -I harbor/setup_claweval_verifier.py
#   OPENAI_API_KEY=... uv run --project harbor harbor run -c harbor/claweval.yaml -a oracle -n 8
# claweval-msb.yaml preserves the microVM reference; MirageParityVerifier
# replays its recorded judge replies without asking a live model twice.
environment:
  import_path: vfsbench_harbor:MirageEnvironment
verifier:
