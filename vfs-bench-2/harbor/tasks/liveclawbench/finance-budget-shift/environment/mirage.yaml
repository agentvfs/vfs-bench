# finance-budget-shift, on vfsbench_harbor's mirage environment.
#
# In place of upstream's environment/Dockerfile: the mocks of its base
# image are the fakes below, and its ENV and COPY lines are `env` and
# `copy`.
#
# Rule B for finance: Mirage has no finance service, so the finance mock is
# this repo's kit fake (mocks/finance), with upstream's API, pages and
# cookie login at localhost:1235. Rule A for email: Mirage fakes Gmail, so
# the email mock becomes Mirage's own gws fake. The mailbox is the /gmail
# mount and the gws CLI, both at this trial's run of it; nothing listens on
# upstream's ports 5001 and 5174. One fake of each serves the whole job.
fakes:
  finance:
    # Upstream's finance seed and the task's seed.sql (harbor/export.py
    # writes it).
    fixture: fixtures/finance.json
    epoch: '2026-04-03T09:00:00Z'
    ports: [1235]
    # Where upstream's image keeps it, which verify.py reads.
    state: /opt/mock/data/finance_app.sqlite
  gws:
    # Upstream's email seed for the task, as Gmail messages (harbor/export.py
    # writes it).
    fixture: fixtures/gws.json
    epoch: '2026-04-03T09:00:00Z'
    # The run's SQLite, which the ported verify.py reads.
    state: /var/lib/mock-data/gws/gws.db
env:
  TASK_NAME: finance-budget-shift
  MOCK_FINANCE_DB_PATH: /opt/mock/data/finance_app.sqlite
  MOCK_FINANCE_SEED_SQL: /workspace/environment/seed.sql
copy:
  /workspace/environment: [seed.sql]
# gws-integ-token is the gws fake's own fixed credential; ${GWS_URL} is this
# trial's run.
workspace:
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
  clis:
    gws:
      cli: gws
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
