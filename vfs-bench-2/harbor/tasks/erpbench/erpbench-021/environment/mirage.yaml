# erpbench-021, on vfsbench_harbor's mirage environment (harbor/erpbench.py writes it).
#
# The task's world is the erpbench kit fake (mocks/erpbench), seeded with
# the world upstream builds for the task (state/erpbench/kit/, outside the
# workspace), its clock at upstream's as-of time. Its tools are one CLI per
# system (tools.json, harbor/tools.ts). The verifier runs upstream's grader
# on the run's database (tests/grade.py).
fakes:
  erpbench:
    fixture: kit/erpbench.json
    epoch: '2026-02-09T09:00:00Z'
    state: /var/lib/mock-data/erpbench/erpbench.db
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/erpbench/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands: [curl, wget]
          reason: the systems are reached through their CLIs
  clis:
    erpbench: {cli: erpbench, config: {url: '${ERPBENCH_URL}'}}
    oracle-fusion: {cli: oracle-fusion, config: {url: '${ERPBENCH_URL}'}}
    gmail: {cli: gmail, config: {url: '${ERPBENCH_URL}'}}
    google-drive: {cli: google-drive, config: {url: '${ERPBENCH_URL}'}}
    google-sheets: {cli: google-sheets, config: {url: '${ERPBENCH_URL}'}}
    slack-tools: {cli: slack-tools, config: {url: '${ERPBENCH_URL}'}}
