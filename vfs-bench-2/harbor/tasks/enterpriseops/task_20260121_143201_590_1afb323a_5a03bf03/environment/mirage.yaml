# task_20260121_143201_590_1afb323a_5a03bf03, EnterpriseOps-Gym's oracle/csm task, on vfsbench_harbor's
# mirage environment (harbor/enterpriseops.py writes it).
#
# Each of the task's servers is its kit fake at upstream's port, seeded from
# the task's seed; its selected tools are a CLI (harbor/tools.ts) that calls
# as the task's user. The trial's clock starts at the task id's time.
# The verifier alone reads each run's SQLite (verifier_state).
fakes:
  enterpriseops_csm:
    fixture: kit/enterpriseops_csm.json
    epoch: '2026-01-21T14:32:01Z'
    ports: [8001]
    verifier_state: /var/lib/mock-data/enterpriseops/enterpriseops_csm.db
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/enterpriseops/dispatches.jsonl
workspace:
  clis:
    sn-csm-server: {cli: sn-csm-server, config: {url: '${ENTERPRISEOPS_CSM_URL}', headers: {x-user-email: "jose.roberson@servicenow.com"}}}
