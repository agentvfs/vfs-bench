# ambiguity-0544, on vfsbench_harbor's mirage environment (harbor/gaia2.py writes it).
#
# Each Gaia2 app is its kit fake (mocks/gaia2_<app>), seeded from the
# scenario's state for it (kit/, written from the scenario, not committed),
# its clock frozen at the scenario's start; its commands are a CLI each
# (tools.json, harbor/tools.ts). The Files app's drive is a mount, a copy
# of its own each trial, which the apps with attachments reach too
# (extras).
fakes:
  gaia2_calendar:
    fixture: kit/gaia2_calendar.json
    epoch: '2024-10-15T07:00:00Z'
    state: /var/lib/mock-data/gaia2/gaia2_calendar.db
  gaia2_contacts:
    fixture: kit/gaia2_contacts.json
    epoch: '2024-10-15T07:00:00Z'
    state: /var/lib/mock-data/gaia2/gaia2_contacts.db
  gaia2_emails:
    fixture: kit/gaia2_emails.json
    epoch: '2024-10-15T07:00:00Z'
    state: /var/lib/mock-data/gaia2/gaia2_emails.db
    extras: {drive: '${RUN_DIR}/cloud-drive', view: /cloud-drive}
  gaia2_messages:
    fixture: kit/gaia2_messages.json
    epoch: '2024-10-15T07:00:00Z'
    state: /var/lib/mock-data/gaia2/gaia2_messages.db
    extras: {drive: '${RUN_DIR}/cloud-drive', view: /cloud-drive}
  gaia2_chats:
    fixture: kit/gaia2_chats.json
    epoch: '2024-10-15T07:00:00Z'
    state: /var/lib/mock-data/gaia2/gaia2_chats.db
    extras: {drive: '${RUN_DIR}/cloud-drive', view: /cloud-drive}
  gaia2_rent_a_flat:
    fixture: kit/gaia2_rent_a_flat.json
    epoch: '2024-10-15T07:00:00Z'
    state: /var/lib/mock-data/gaia2/gaia2_rent_a_flat.db
  gaia2_shopping:
    fixture: kit/gaia2_shopping.json
    epoch: '2024-10-15T07:00:00Z'
    state: /var/lib/mock-data/gaia2/gaia2_shopping.db
  gaia2_cabs:
    fixture: kit/gaia2_cabs.json
    epoch: '2024-10-15T07:00:00Z'
    state: /var/lib/mock-data/gaia2/gaia2_cabs.db
  gaia2_city:
    fixture: kit/gaia2_city.json
    epoch: '2024-10-15T07:00:00Z'
    state: /var/lib/mock-data/gaia2/gaia2_city.db
copy:
  /cloud-drive: drive/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/gaia2/dispatches.jsonl
workspace:
  mounts:
    /cloud-drive:
      vfs: disk
      mode: write
      read: fresh
      config: {root: '${RUN_DIR}/cloud-drive'}
  clis:
    calendar: {cli: calendar, config: {url: '${GAIA2_CALENDAR_URL}'}}
    contacts: {cli: contacts, config: {url: '${GAIA2_CONTACTS_URL}'}}
    emails: {cli: emails, config: {url: '${GAIA2_EMAILS_URL}'}}
    messages: {cli: messages, config: {url: '${GAIA2_MESSAGES_URL}'}}
    chats: {cli: chats, config: {url: '${GAIA2_CHATS_URL}'}}
    rent-a-flat: {cli: rent-a-flat, config: {url: '${GAIA2_RENT_A_FLAT_URL}'}}
    shopping: {cli: shopping, config: {url: '${GAIA2_SHOPPING_URL}'}}
    cabs: {cli: cabs, config: {url: '${GAIA2_CABS_URL}'}}
    city: {cli: city, config: {url: '${GAIA2_CITY_URL}'}}
