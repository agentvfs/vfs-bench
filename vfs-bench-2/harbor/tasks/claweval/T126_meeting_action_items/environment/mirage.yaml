# T126_meeting_action_items, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (harbor/tools.ts).
fakes:
  claweval_notes:
    fixture: kit/claweval_notes.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9105
  claweval_todo:
    fixture: kit/claweval_todo.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9102
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    notes:
      cli: notes
      config:
        url: ${CLAWEVAL_NOTES_URL}
    todo:
      cli: todo
      config:
        url: ${CLAWEVAL_TODO_URL}
