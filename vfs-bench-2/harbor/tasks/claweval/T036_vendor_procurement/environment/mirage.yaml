# T036_vendor_procurement, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (harbor/tools.ts).
fakes:
  claweval_finance:
    fixture: kit/claweval_finance.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9104
  claweval_kb:
    fixture: kit/claweval_kb.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9106
  claweval_inventory:
    fixture: kit/claweval_inventory.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9108
  claweval_rss:
    fixture: kit/claweval_rss.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9109
  claweval_crm:
    fixture: kit/claweval_crm.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9110
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    inventory:
      cli: inventory
      config:
        url: ${CLAWEVAL_INVENTORY_URL}
    rss:
      cli: rss
      config:
        url: ${CLAWEVAL_RSS_URL}
    crm:
      cli: crm
      config:
        url: ${CLAWEVAL_CRM_URL}
    kb:
      cli: kb
      config:
        url: ${CLAWEVAL_KB_URL}
    finance:
      cli: finance
      config:
        url: ${CLAWEVAL_FINANCE_URL}
