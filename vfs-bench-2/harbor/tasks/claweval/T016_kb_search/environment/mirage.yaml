# T016_kb_search, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (harbor/tools.ts).
fakes:
  claweval_kb:
    fixture: kit/claweval_kb.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9106
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    kb:
      cli: kb
      config:
        url: ${CLAWEVAL_KB_URL}
