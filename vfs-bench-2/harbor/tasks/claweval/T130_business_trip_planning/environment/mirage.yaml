# T130_business_trip_planning, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, its tools CLIs
# (harbor/tools.ts), and the verifier's VM gets upstream's grader and
# the judge's host (claweval_grade.py).
#
# Gmail and calendar are Mirage's gws fake: the /gmail and /calendar
# mounts and the gws CLI, at this trial's run of it, with upstream's
# fixtures under upstream's ids; gws-integ-token is the fake's own
# credential. Its SQLite is what the verifier reads them from.
fakes:
  claweval_contacts:
    fixture: kit/claweval_contacts.json
    epoch: '2026-03-25T09:00:00Z'
    ports:
    - 9103
  gws:
    fixture: kit/gws.json
    epoch: '2026-03-25T09:00:00Z'
    state: /var/lib/mock-data/gws/gws.db
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
    /calendar:
      vfs: gcal
      mode: read
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
        today: '2026-03-25'
  clis:
    contacts:
      cli: contacts
      config:
        url: ${CLAWEVAL_CONTACTS_URL}
    gws:
      cli: gws
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
verifier:
  copy:
    /opt/claweval/src: ${STATE}/claweval/src/src
    /opt/claweval/site: ${STATE}/harbor/site/claweval
    /opt/claweval/tasks/T130_business_trip_planning: ${STATE}/claweval/src/tasks/T130_business_trip_planning
    /opt/claweval/tasks/T129zh_business_trip_planning: ${STATE}/claweval/src/tasks/T129zh_business_trip_planning
  egress:
  - OPENAI_BASE_URL
