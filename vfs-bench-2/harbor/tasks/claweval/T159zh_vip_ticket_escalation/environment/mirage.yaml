# T159zh_vip_ticket_escalation, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (harbor/tools.ts).
#
# Gmail and calendar are Mirage's gws fake: the /gmail and /calendar
# mounts and the gws CLI, at this trial's run of it, with upstream's
# fixtures under upstream's ids; gws-integ-token is the fake's own
# credential. Its SQLite is what the verifier reads them from.
# gws has no drafts, so gmail_save_draft is upstream's tool, at
# upstream's gmail port (mocks/claweval_gmail).
fakes:
  claweval_helpdesk:
    fixture: kit/claweval_helpdesk.json
    epoch: '2026-03-27T02:45:00Z'
    ports:
    - 9107
  claweval_crm:
    fixture: kit/claweval_crm.json
    epoch: '2026-03-27T02:45:00Z'
    ports:
    - 9110
  claweval_gmail:
    fixture: kit/claweval_gmail.json
    epoch: '2026-03-27T02:45:00Z'
    ports:
    - 9100
  claweval_contacts:
    fixture: kit/claweval_contacts.json
    epoch: '2026-03-27T02:45:00Z'
    ports:
    - 9103
  claweval_kb:
    fixture: kit/claweval_kb.json
    epoch: '2026-03-27T02:45:00Z'
    ports:
    - 9106
  gws:
    fixture: kit/gws.json
    epoch: '2026-03-27T02:45:00Z'
    state: /var/lib/mock-data/gws/gws.db
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
  clis:
    helpdesk:
      cli: helpdesk
      config:
        url: ${CLAWEVAL_HELPDESK_URL}
    crm:
      cli: crm
      config:
        url: ${CLAWEVAL_CRM_URL}
    kb:
      cli: kb
      config:
        url: ${CLAWEVAL_KB_URL}
    contacts:
      cli: contacts
      config:
        url: ${CLAWEVAL_CONTACTS_URL}
    gmail:
      cli: gmail
      config:
        url: ${CLAWEVAL_GMAIL_URL}
    gws:
      cli: gws
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
