# T144_quarterly_business_insight, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, its tools CLIs
# (harbor/tools.ts), and the verifier's VM gets upstream's grader and
# the judge's host (claweval_grade.py).
fakes:
  claweval_finance:
    fixture: kit/claweval_finance.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9104
  claweval_crm:
    fixture: kit/claweval_crm.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9110
  claweval_rss:
    fixture: kit/claweval_rss.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9109
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    finance:
      cli: finance
      config:
        url: ${CLAWEVAL_FINANCE_URL}
    crm:
      cli: crm
      config:
        url: ${CLAWEVAL_CRM_URL}
    rss:
      cli: rss
      config:
        url: ${CLAWEVAL_RSS_URL}
verifier:
  copy:
    /opt/claweval/src: ${STATE}/claweval/src/src
    /opt/claweval/site: ${STATE}/harbor/site/claweval
    /opt/claweval/tasks/T144_quarterly_business_insight: ${STATE}/claweval/src/tasks/T144_quarterly_business_insight
    /opt/claweval/tasks/T143zh_quarterly_business_insight: ${STATE}/claweval/src/tasks/T143zh_quarterly_business_insight
  egress:
  - OPENAI_BASE_URL
