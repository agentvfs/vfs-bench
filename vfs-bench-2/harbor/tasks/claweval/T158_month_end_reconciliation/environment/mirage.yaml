# T158_month_end_reconciliation, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, its tools CLIs
# (harbor/tools.ts), and the verifier's VM gets upstream's grader and
# the judge's host (claweval_grade.py).
fakes:
  claweval_finance:
    fixture: kit/claweval_finance.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9104
  claweval_crm:
    fixture: kit/claweval_crm.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9110
  claweval_config:
    fixture: kit/claweval_config.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9111
  claweval_inventory:
    fixture: kit/claweval_inventory.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9108
  claweval_scheduler:
    fixture: kit/claweval_scheduler.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9112
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    finance:
      cli: finance
      config:
        url: ${CLAWEVAL_FINANCE_URL}
    crm:
      cli: crm
      config:
        url: ${CLAWEVAL_CRM_URL}
    config:
      cli: config
      config:
        url: ${CLAWEVAL_CONFIG_URL}
    inventory:
      cli: inventory
      config:
        url: ${CLAWEVAL_INVENTORY_URL}
    scheduler:
      cli: scheduler
      config:
        url: ${CLAWEVAL_SCHEDULER_URL}
verifier:
  copy:
    /opt/claweval/src: ${STATE}/claweval/src/src
    /opt/claweval/site: ${STATE}/harbor/site/claweval
    /opt/claweval/tasks/T158_month_end_reconciliation: ${STATE}/claweval/src/tasks/T158_month_end_reconciliation
    /opt/claweval/tasks/T157zh_month_end_reconciliation: ${STATE}/claweval/src/tasks/T157zh_month_end_reconciliation
  egress:
  - OPENAI_BASE_URL
