# T120_inventory_cost_analysis, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, its tools CLIs
# (harbor/tools.ts), and the verifier's VM gets upstream's grader and
# the judge's host (claweval_grade.py).
fakes:
  claweval_inventory:
    fixture: kit/claweval_inventory.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9108
  claweval_finance:
    fixture: kit/claweval_finance.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9104
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    inventory:
      cli: inventory
      config:
        url: ${CLAWEVAL_INVENTORY_URL}
    finance:
      cli: finance
      config:
        url: ${CLAWEVAL_FINANCE_URL}
verifier:
  copy:
    /opt/claweval/src: ${STATE}/claweval/src/src
    /opt/claweval/site: ${STATE}/harbor/site/claweval
    /opt/claweval/tasks/T120_inventory_cost_analysis: ${STATE}/claweval/src/tasks/T120_inventory_cost_analysis
    /opt/claweval/tasks/T119zh_inventory_cost_analysis: ${STATE}/claweval/src/tasks/T119zh_inventory_cost_analysis
  egress:
  - OPENAI_BASE_URL
