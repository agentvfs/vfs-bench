# T078_officeqa_max_yield_spread, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (harbor/tools.ts).
fakes:
  claweval_ocr:
    fixture: kit/claweval_ocr.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9122
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    ocr-t52:
      cli: ocr-t52
      config:
        url: ${CLAWEVAL_OCR_URL}
