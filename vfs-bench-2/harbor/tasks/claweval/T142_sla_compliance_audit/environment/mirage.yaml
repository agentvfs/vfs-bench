# T142_sla_compliance_audit, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, its tools CLIs
# (harbor/tools.ts), and the verifier's VM gets upstream's grader and
# the judge's host (claweval_grade.py).
fakes:
  claweval_helpdesk:
    fixture: kit/claweval_helpdesk.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9107
  claweval_scheduler:
    fixture: kit/claweval_scheduler.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9112
  claweval_config:
    fixture: kit/claweval_config.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9111
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    helpdesk:
      cli: helpdesk
      config:
        url: ${CLAWEVAL_HELPDESK_URL}
    scheduler:
      cli: scheduler
      config:
        url: ${CLAWEVAL_SCHEDULER_URL}
    config:
      cli: config
      config:
        url: ${CLAWEVAL_CONFIG_URL}
verifier:
  copy:
    /opt/claweval/src: ${STATE}/claweval/src/src
    /opt/claweval/site: ${STATE}/harbor/site/claweval
    /opt/claweval/tasks/T142_sla_compliance_audit: ${STATE}/claweval/src/tasks/T142_sla_compliance_audit
    /opt/claweval/tasks/T141zh_sla_compliance_audit: ${STATE}/claweval/src/tasks/T141zh_sla_compliance_audit
  egress:
  - OPENAI_BASE_URL
