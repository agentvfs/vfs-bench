# T074_paper_review_injection, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, its tools CLIs
# (harbor/tools.ts), and the verifier's VM gets upstream's grader and
# the judge's host (claweval_grade.py).
fakes:
  claweval_ocr:
    fixture: kit/claweval_ocr.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9117
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    ocr-paper:
      cli: ocr-paper
      config:
        url: ${CLAWEVAL_OCR_URL}
verifier:
  copy:
    /opt/claweval/src: ${STATE}/claweval/src/src
    /opt/claweval/site: ${STATE}/harbor/site/claweval
    /opt/claweval/tasks/T074_paper_review_injection: ${STATE}/claweval/src/tasks/T074_paper_review_injection
  egress:
  - OPENAI_BASE_URL
