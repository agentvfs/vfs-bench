# T138_restock_chain_check, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, its tools CLIs
# (harbor/tools.ts), and the verifier's VM gets upstream's grader and
# the judge's host (claweval_grade.py).
fakes:
  claweval_scheduler:
    fixture: kit/claweval_scheduler.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9112
  claweval_config:
    fixture: kit/claweval_config.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9111
  claweval_inventory:
    fixture: kit/claweval_inventory.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9108
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    scheduler:
      cli: scheduler
      config:
        url: ${CLAWEVAL_SCHEDULER_URL}
    config:
      cli: config
      config:
        url: ${CLAWEVAL_CONFIG_URL}
    inventory:
      cli: inventory
      config:
        url: ${CLAWEVAL_INVENTORY_URL}
verifier:
  copy:
    /opt/claweval/src: ${STATE}/claweval/src/src
    /opt/claweval/site: ${STATE}/harbor/site/claweval
    /opt/claweval/tasks/T138_restock_chain_check: ${STATE}/claweval/src/tasks/T138_restock_chain_check
    /opt/claweval/tasks/T137zh_restock_chain_check: ${STATE}/claweval/src/tasks/T137zh_restock_chain_check
  egress:
  - OPENAI_BASE_URL
