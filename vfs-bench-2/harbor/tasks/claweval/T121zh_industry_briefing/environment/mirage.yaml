# T121zh_industry_briefing, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (harbor/tools.ts).
#
# Gmail and calendar are Mirage's gws fake: the /gmail and /calendar
# mounts and the gws CLI, at this trial's run of it, with upstream's
# fixtures under upstream's ids; gws-integ-token is the fake's own
# credential. Its SQLite is what the verifier reads them from.
# gws has no drafts, so gmail_save_draft is upstream's tool, at
# upstream's gmail port (mocks/claweval_gmail).
fakes:
  claweval_rss:
    fixture: kit/claweval_rss.json
    epoch: '2026-03-26T00:00:00Z'
    ports:
    - 9109
  claweval_gmail:
    fixture: kit/claweval_gmail.json
    epoch: '2026-03-26T00:00:00Z'
    ports:
    - 9100
  gws:
    fixture: kit/gws.json
    epoch: '2026-03-26T00:00:00Z'
    state: /var/lib/mock-data/gws/gws.db
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
  clis:
    rss:
      cli: rss
      config:
        url: ${CLAWEVAL_RSS_URL}
    gmail:
      cli: gmail
      config:
        url: ${CLAWEVAL_GMAIL_URL}
    gws:
      cli: gws
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
