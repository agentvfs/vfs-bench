# T039zh_onboarding_coordinator, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, its tools CLIs
# (harbor/tools.ts), and the verifier's VM gets upstream's grader and
# the judge's host (claweval_grade.py).
#
# Gmail and calendar are Mirage's gws fake: the /gmail and /calendar
# mounts and the gws CLI, at this trial's run of it, with upstream's
# fixtures under upstream's ids; gws-integ-token is the fake's own
# credential. Its SQLite is what the verifier reads them from.
# gws has no drafts, so gmail_save_draft is upstream's tool, at
# upstream's gmail port (mocks/claweval_gmail).
fakes:
  claweval_gmail:
    fixture: kit/claweval_gmail.json
    epoch: '2026-03-05T09:00:00Z'
    ports:
    - 9100
  claweval_todo:
    fixture: kit/claweval_todo.json
    epoch: '2026-03-05T09:00:00Z'
    ports:
    - 9102
  claweval_contacts:
    fixture: kit/claweval_contacts.json
    epoch: '2026-03-05T09:00:00Z'
    ports:
    - 9103
  claweval_kb:
    fixture: kit/claweval_kb.json
    epoch: '2026-03-05T09:00:00Z'
    ports:
    - 9106
  claweval_inventory:
    fixture: kit/claweval_inventory.json
    epoch: '2026-03-05T09:00:00Z'
    ports:
    - 9108
  gws:
    fixture: kit/gws.json
    epoch: '2026-03-05T09:00:00Z'
    state: /var/lib/mock-data/gws/gws.db
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
    /calendar:
      vfs: gcal
      mode: read
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
        today: '2026-03-05'
  clis:
    gmail:
      cli: gmail
      config:
        url: ${CLAWEVAL_GMAIL_URL}
    todo:
      cli: todo
      config:
        url: ${CLAWEVAL_TODO_URL}
    contacts:
      cli: contacts
      config:
        url: ${CLAWEVAL_CONTACTS_URL}
    kb:
      cli: kb
      config:
        url: ${CLAWEVAL_KB_URL}
    inventory:
      cli: inventory
      config:
        url: ${CLAWEVAL_INVENTORY_URL}
    gws:
      cli: gws
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
verifier:
  copy:
    /opt/claweval/src: ${STATE}/claweval/src/src
    /opt/claweval/site: ${STATE}/harbor/site/claweval
    /opt/claweval/tasks/T039zh_onboarding_coordinator: ${STATE}/claweval/src/tasks/T039zh_onboarding_coordinator
  egress:
  - OPENAI_BASE_URL
