# T024_crm_data_export, on vfsbench_harbor's mirage environment (harbor/claweval.py writes it).
#
# Each service is its kit fake at upstream's port, its tools CLIs
# (harbor/tools.ts), and the verifier's VM gets upstream's grader and
# the judge's host (claweval_grade.py).
fakes:
  claweval_crm:
    fixture: kit/claweval_crm.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9110
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    crm:
      cli: crm
      config:
        url: ${CLAWEVAL_CRM_URL}
verifier:
  copy:
    /opt/claweval/src: ${STATE}/claweval/src/src
    /opt/claweval/site: ${STATE}/harbor/site/claweval
    /opt/claweval/tasks/T024_crm_data_export: ${STATE}/claweval/src/tasks/T024_crm_data_export
    /opt/claweval/tasks/T023zh_crm_data_export: ${STATE}/claweval/src/tasks/T023zh_crm_data_export
  egress:
  - OPENAI_BASE_URL
