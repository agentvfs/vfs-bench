  - path: harbor/tasks/liveclawbench/newsletter-digest-forward
  - path: harbor/tasks/liveclawbench/procurement-quote-compare-reply
  - path: harbor/tasks/liveclawbench/stale-client-escalation
  - path: harbor/tasks/liveclawbench/vendor-requirement-followup
  - path: harbor/tasks/liveclawbench/candidate-interview-slot-confirm
  - path: harbor/tasks/liveclawbench/email-reply
  - path: harbor/tasks/liveclawbench/email-sending-verify
  - path: harbor/tasks/liveclawbench/email-writing
  - path: harbor/tasks/liveclawbench/interview-slot-verify
  - path: harbor/tasks/liveclawbench/meeting-slot-race
  - path: harbor/tasks/liveclawbench/finance-anomaly-detect
  - path: harbor/tasks/liveclawbench/finance-dashboard-repair
  - path: harbor/tasks/liveclawbench/finance-depreciation-audit
  - path: harbor/tasks/liveclawbench/finance-expense-log
