# liveclawbench.yaml's tasks, each trial's verifier run in a microVM of its
# own (microsandbox's msb) with real CPython, not in the Mirage workspace's
# Pyodide. From vfs-bench-2/:
#   uv run --project harbor harbor run -c harbor/liveclawbench-msb.yaml -a oracle -n 24 -o state/harbor/jobs
# Any other run takes it as a flag:
#   --verifier vfsbench_harbor:MicrosandboxVerifier
environment:
  import_path: vfsbench_harbor:MirageEnvironment
verifier:
  import_path: vfsbench_harbor:MicrosandboxVerifier
tasks:
