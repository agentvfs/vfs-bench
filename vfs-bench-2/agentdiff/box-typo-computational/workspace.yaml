# Agent-Diff box_145 on the box_default template. The `box` CLI is
# installed by the harness (agentdiff/index.ts); Box's files are mounted at
# /box, against the run's own environment.
mode: exec
runtimes:
  - name: pyodide
    config:
      lock_file_url: ${PYTHON_PACKAGES}/pyodide-lock.json
      package_base_url: ${PYTHON_PACKAGES}/
  - workspace
mounts:
  /workspace:
    vfs: ram
    mode: write
  /box:
    vfs: box
    mode: write
    config:
      endpoint: ${BOX_ENDPOINT}
      accessToken: agent-diff
