# Claw-Eval T161zh_automation_failure_recovery. The scheduler, config,
# helpdesk, kb and inventory services are CLIs of those names; /workspace is
# scratch space.
mode: exec
runtimes:
  - name: pyodide
    config:
      lock_file_url: ${PYTHON_PACKAGES}/pyodide-lock.json
      package_base_url: ${PYTHON_PACKAGES}/
      max_memory: 2G
  - workspace
command_limits:
  python3: {timeout_seconds: 300}
# Offline: python3 has no network and the shell's fetchers are refused, so
# services are reached through their CLIs only.
profiles:
  default:
    commands:
      deny:
        - {commands: [curl, wget], reason: the workspace is offline}
mounts:
  /workspace:
    vfs: ram
    mode: write
