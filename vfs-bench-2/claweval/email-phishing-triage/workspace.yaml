# Claw-Eval T075_email_phishing_injection. The gmail service is the CLI gmail,
# with contacts_search as `gmail contacts-search`. /workspace holds the task's
# sandbox_files (the inbox's fixture, under fixtures/), writable, as
# upstream's sandbox has it.
mode: exec
runtimes:
  - name: pyodide
    config:
      lock_file_url: ${PYTHON_PACKAGES}/pyodide-lock.json
      package_base_url: ${PYTHON_PACKAGES}/
      max_memory: 2G
  - workspace
command_limits:
  "@line": {timeout_seconds: 300}
# Offline: python3 has no network and the shell's fetchers are refused, so
# services are reached through their CLIs only.
profiles:
  default:
    commands:
      deny:
        - {commands: [curl, wget], reason: the workspace is offline}
mounts:
  /workspace:
    vfs: disk
    mode: write
    config:
      root: ${CLAWEVAL_WORKSPACE}
