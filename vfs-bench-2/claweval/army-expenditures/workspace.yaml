# Claw-Eval T085_officeqa_army_expenditures. The ocr_t59 service is the CLI
# ocr-t59. /workspace holds the task's sandbox_files (the two bulletins'
# PDFs and OCR text, under fixtures/), writable, as upstream's sandbox has it.
mode: exec
runtimes:
  - name: pyodide
    config:
      lock_file_url: ${PYTHON_PACKAGES}/pyodide-lock.json
      package_base_url: ${PYTHON_PACKAGES}/
      max_memory: 2G
  - workspace
command_limits:
  "@line": {timeout_seconds: 600}
# Offline: python3 has no network and the shell's fetchers are refused, so
# services are reached through their CLIs only.
profiles:
  default:
    commands:
      deny:
        - {commands: [curl, wget], reason: the workspace is offline}
mounts:
  /workspace:
    vfs: disk
    mode: write
    config:
      root: ${CLAWEVAL_WORKSPACE}
