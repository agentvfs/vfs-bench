# ComplexMCP task 12: LightTalk, seed 42. The servers' CLIs are installed by
# the harness from the running fake (complexmcp/index.ts).
mode: exec
runtimes:
  - name: pyodide
    config:
      lock_file_url: ${PYTHON_PACKAGES}/pyodide-lock.json
      package_base_url: ${PYTHON_PACKAGES}/
      max_memory: 2G
  - workspace
command_limits:
  "@line": {timeout_seconds: 600}
# Offline: python3 has no network and the shell's fetchers are refused, so
# services are reached through their CLIs only.
profiles:
  default:
    commands:
      deny:
        - {commands: [curl, wget], reason: the workspace is offline}
mounts:
  /workspace:
    vfs: ram
