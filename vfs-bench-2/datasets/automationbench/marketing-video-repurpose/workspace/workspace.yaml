# marketing.video_repurpose, on vfsbench_harbor's mirage environment (datasets/automationbench/convert.py writes it).
#
# The task's world is the automationbench kit fake (mocks/automationbench),
# seeded with the world upstream builds for the task (kit/, written from
# upstream, not committed), its clock at the task's epoch. Its tools are the
# api CLI (tools.json, workspace/tools.ts).
fakes:
  automationbench:
    fixture: fixtures/automationbench.json
    epoch: '2026-01-27T09:00:00Z'
    state: /var/lib/mock-data/automationbench/automationbench.db
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/automationbench/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        curl: {decision: deny, reason: the world is reached through the api CLI}
        wget: {decision: deny, reason: the world is reached through the api CLI}
  clis:
    api:
      cli: api
      machine: in_process
      config: {url: '${AUTOMATIONBENCH_URL}'}
