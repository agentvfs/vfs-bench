version = "1.0"

[task]
name = "vfs-bench-2/automationbench.operations-generator-load-testing-schedule"

[metadata]
category = "operations"
upstream = "zapier/AutomationBench@4a8e106 operations.generator_load_testing_schedule (example 1398)"

[verifier]
# The rubric takes seconds.
timeout_sec = 120.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
# The agent reaches the world through the api CLI alone; curl and wget are
# off (environment/mirage.yaml).
allow_internet = false
