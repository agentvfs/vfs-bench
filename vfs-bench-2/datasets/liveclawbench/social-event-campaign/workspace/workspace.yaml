# social-event-campaign, on vfsbench_harbor's mirage environment.
#
# In place of upstream's environment/Dockerfile: the mocks of its base
# image are the fakes below, and its COPY line is `copy`, without what
# its .dockerignore leaves out.
#
# Rule B for the social network: Mirage has none, so the social mock is
# this repo's kit fake (mocks/social), with upstream's API, pages and
# cookie login at localhost:5008. Rule A for email: Mirage fakes
# Gmail, so the email mock becomes Mirage's own gws fake. The mailbox is
# the /gmail mount and the gws CLI, both at this trial's run of it;
# nothing listens on upstream's ports 5001 and 5174. One fake of each
# serves the whole job.
fakes:
  social:
    # Upstream's social seed and the task's seed.json, as its image loads
    # it (generate.py writes it).
    fixture: fixtures/social.json
    epoch: '2026-04-03T09:00:00Z'
    ports: [5008]
    # Where upstream's image keeps it, which verify.py reads.
    state: /var/lib/mock-data/social/social.db
  gws:
    # Upstream's email seed for the task, as Gmail messages (generate.py writes it).
    fixture: fixtures/gws.json
    epoch: '2026-04-03T09:00:00Z'
    # The run's SQLite, which the ported verify.py reads.
    state: /var/lib/mock-data/gws/gws.db
env:
  TASK_NAME: social-event-campaign
copy:
  /workspace/environment: [.dockerignore]
# gws-integ-token is the gws fake's own fixed credential; ${GWS_URL} is this
# trial's run.
workspace:
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
  clis:
    gws:
      cli: gws
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
