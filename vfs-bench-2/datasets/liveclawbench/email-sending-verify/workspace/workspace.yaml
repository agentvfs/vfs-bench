# email-sending-verify, on vfsbench_harbor's mirage environment.
#
# In place of upstream's environment/Dockerfile: the mocks of its base
# image are the fakes below, and its COPY and RUN lines are
# `copy` and `run`, but for the RUN that installs a browser, which the
# workspace has none of.
#
# Rule A: Mirage fakes Gmail, so the email mock becomes Mirage's own gws
# fake. The mailbox is the /gmail mount and the gws CLI, both at this
# trial's run of it; nothing listens on upstream's ports 5001 and 5174. One
# fake serves the whole job.
fakes:
  gws:
    # Upstream's email seed for the task, as Gmail messages (convert.py
    # writes it).
    fixture: fixtures/gws.json
    epoch: '2026-04-03T09:00:00Z'
    # The run's SQLite, which the ported verify.py reads.
    state: /var/lib/mock-data/gws/gws.db
    # Upstream's C2 fault (c2-skip-persist, on the email mock's send): the
    # first send answers as sent, with the id the next message takes, and
    # stores nothing; a retry is sent. A kit fault plan, armed on this
    # trial's run.
    faults:
      - method: POST
        route: /gmail/v1/users/me/messages/send
        status: 200
        body: {id: msg0011, threadId: msg0011, labelIds: [SENT]}
env:
  TASK_NAME: email-sending-verify
copy:
  /workspace/environment: []
run:
  - mkdir -p /workspace/output
# gws-integ-token is the gws fake's own fixed credential; ${GWS_URL} is this
# trial's run.
workspace:
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
  clis:
    gws:
      cli: gws
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
