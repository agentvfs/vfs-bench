# weather-aqi-report, on vfsbench_harbor's mirage environment.
#
# In place of upstream's environment/Dockerfile: the mocks of its base
# image are the fakes below, and its COPY line is `copy`.
#
# Rule B: Mirage has no weather service, so the weather mock is this repo's
# kit fake (mocks/weather), with upstream's pages and API at localhost:3000.
# Its "today" is the epoch's date in China Standard Time. One fake serves
# the whole job; this trial is a run of its own on it.
fakes:
  weather:
    # Upstream's weather seed (convert.py writes it).
    fixture: fixtures/weather.json
    epoch: '2026-04-03T09:00:00Z'
    ports: [3000]
    # Where upstream's image keeps it; verify.py reads the API instead.
    state: /tmp/weather.db
env:
  TASK_NAME: weather-aqi-report
copy:
  /workspace/environment: []
