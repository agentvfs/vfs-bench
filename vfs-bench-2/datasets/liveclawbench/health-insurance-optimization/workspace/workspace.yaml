# health-insurance-optimization, on vfsbench_harbor's mirage environment.
#
# In place of upstream's environment/Dockerfile: the mocks of its base
# image are the fakes below, and its COPY, RUN, ENV and WORKDIR lines are
# `copy`, `run`, `env` and `workdir`.
#
# Rule B: Mirage has no such service, so each upstream mock is this repo's
# kit fake that runs upstream's own app: insurance (mocks/insurance).
# Rule A for email and the calendar: Mirage fakes Gmail and Google
# Calendar, so their mocks become Mirage's own gws fake, the mailbox at
# /gmail and the calendar at /calendar, with the gws CLI for both;
# nothing listens on upstream's ports 5001, 5174 and 5006.
# One fake of each serves the whole job; this trial is a run of its own on
# each.
fakes:
  insurance:
    # Upstream's seed for the task (generate.py writes it).
    fixture: fixtures/insurance.json
    epoch: '2026-04-03T09:00:00Z'
    ports: [5010]
    # Where upstream's image keeps its SQLite, which verify.py reads.
    state: /var/lib/mock-data/insurance/insurance.db
  gws:
    # Upstream's email and calendar seeds for the task, as Gmail messages
    # and Peter's calendar (generate.py writes it).
    fixture: fixtures/gws.json
    epoch: '2026-04-03T09:00:00Z'
    # The run's SQLite, which the ported verify.py reads.
    state: /var/lib/mock-data/gws/gws.db
env:
  TASK_NAME: health-insurance-optimization
copy:
  /workspace/environment: []
# gws-integ-token is the gws fake's own fixed credential; ${GWS_URL} is this
# trial's run. The calendar's default listing reaches 90 days past `today`,
# the epoch's date rather than the host's.
workspace:
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
    /calendar:
      vfs: gcal
      mode: read
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}', today: '2026-04-03'}
  clis:
    gws:
      cli: gws
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
