# stale-client-escalation, on vfsbench_harbor's mirage environment.
#
# In place of upstream's environment/Dockerfile: the mocks of its base
# image are the fakes below, and its COPY and RUN lines are
# `copy` and `run`.
#
# Rule A: Mirage fakes Gmail, so the email mock becomes Mirage's own gws
# fake. The mailbox is the /gmail mount and the gws CLI, both at this
# trial's run of it; nothing listens on upstream's ports 5001 and 5174. One
# fake serves the whole job.
fakes:
  gws:
    # Upstream's email seed for the task, as Gmail messages (generate.py
    # writes it).
    fixture: fixtures/gws.json
    epoch: '2026-04-03T09:00:00Z'
    # The run's SQLite, which the ported verify.py reads.
    state: /var/lib/mock-data/gws/gws.db
env:
  TASK_NAME: stale-client-escalation
copy:
  /workspace/environment: [notes]
run:
  - mkdir -p /workspace/notes && cp /workspace/environment/notes/client-escalation-log.md /workspace/notes/client-escalation-log.md
  - mkdir -p /workspace/output
# gws-integ-token is the gws fake's own fixed credential; ${GWS_URL} is this
# trial's run.
workspace:
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
  clis:
    gws:
      cli: gws
      config: {accessToken: gws-integ-token, apiBase: '${GWS_URL}'}
