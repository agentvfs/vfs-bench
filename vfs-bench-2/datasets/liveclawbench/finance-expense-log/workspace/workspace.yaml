# finance-expense-log, on vfsbench_harbor's mirage environment.
#
# In place of upstream's environment/Dockerfile: the mocks of its base
# image are the fakes below, and its ENV and COPY lines are `env` and
# `copy`.
#
# Rule B: Mirage has no finance service, so the finance mock is this repo's
# kit fake (mocks/finance), with upstream's API, pages and cookie login at
# localhost:1235 and its SQLite tables where verify.py reads them. One fake
# serves the whole job; this trial is a run of its own on it.
fakes:
  finance:
    # Upstream's finance seed (convert.py writes it).
    fixture: fixtures/finance.json
    epoch: '2026-04-03T09:00:00Z'
    ports: [1235]
    # Where upstream's image keeps it, which verify.py reads.
    state: /opt/mock/data/finance_app.sqlite
env:
  TASK_NAME: finance-expense-log
  MOCK_FINANCE_DB_PATH: /opt/mock/data/finance_app.sqlite
copy:
  /workspace/environment: [seed.sql]
