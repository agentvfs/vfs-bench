# T128_ticket_assignment, on vfsbench_harbor's mirage environment (datasets/claweval/generate.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
fakes:
  claweval_contacts:
    fixture: fixtures/claweval_contacts.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9103
  claweval_helpdesk:
    fixture: fixtures/claweval_helpdesk.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9107
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    helpdesk:
      cli: helpdesk
      config:
        url: ${CLAWEVAL_HELPDESK_URL}
    contacts:
      cli: contacts
      config:
        url: ${CLAWEVAL_CONTACTS_URL}
