# T018_ticket_triage, on vfsbench_harbor's mirage environment (datasets/claweval/convert.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
fakes:
  claweval_helpdesk:
    fixture: fixtures/claweval_helpdesk.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9107
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        curl:
          decision: deny
          reason: the services are reached through their tools
        wget:
          decision: deny
          reason: the services are reached through their tools
  clis:
    helpdesk:
      cli: helpdesk
      machine: in_process
      config:
        url: ${CLAWEVAL_HELPDESK_URL}
