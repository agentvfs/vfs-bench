# T132_order_profit_analysis, on vfsbench_harbor's mirage environment (datasets/claweval/generate.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
fakes:
  claweval_finance:
    fixture: fixtures/claweval_finance.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9104
  claweval_inventory:
    fixture: fixtures/claweval_inventory.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9108
  claweval_crm:
    fixture: fixtures/claweval_crm.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9110
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    crm:
      cli: crm
      config:
        url: ${CLAWEVAL_CRM_URL}
    inventory:
      cli: inventory
      config:
        url: ${CLAWEVAL_INVENTORY_URL}
    finance:
      cli: finance
      config:
        url: ${CLAWEVAL_FINANCE_URL}
