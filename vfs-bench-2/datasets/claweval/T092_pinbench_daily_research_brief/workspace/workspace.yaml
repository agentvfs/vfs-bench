# T092_pinbench_daily_research_brief, on vfsbench_harbor's mirage environment (datasets/claweval/convert.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
fakes:
  claweval_rss:
    fixture: fixtures/claweval_rss.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9109
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    rss:
      cli: rss
      config:
        url: ${CLAWEVAL_RSS_URL}
