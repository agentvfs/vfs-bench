# T080_officeqa_bond_yield_change, on vfsbench_harbor's mirage environment (datasets/claweval/convert.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
fakes:
  claweval_ocr:
    fixture: fixtures/claweval_ocr.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9124
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    ocr-t54:
      cli: ocr-t54
      config:
        url: ${CLAWEVAL_OCR_URL}
