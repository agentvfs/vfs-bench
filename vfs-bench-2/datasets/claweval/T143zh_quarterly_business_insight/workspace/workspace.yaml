# T143zh_quarterly_business_insight, on vfsbench_harbor's mirage environment (datasets/claweval/convert.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
fakes:
  claweval_finance:
    fixture: fixtures/claweval_finance.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9104
  claweval_crm:
    fixture: fixtures/claweval_crm.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9110
  claweval_rss:
    fixture: fixtures/claweval_rss.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9109
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    finance:
      cli: finance
      config:
        url: ${CLAWEVAL_FINANCE_URL}
    crm:
      cli: crm
      config:
        url: ${CLAWEVAL_CRM_URL}
    rss:
      cli: rss
      config:
        url: ${CLAWEVAL_RSS_URL}
