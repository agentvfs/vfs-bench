# T099_pinbench_second_brain_recall, on vfsbench_harbor's mirage environment (datasets/claweval/generate.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
fakes:
  claweval_notes:
    fixture: fixtures/claweval_notes.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9105
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    notes:
      cli: notes
      config:
        url: ${CLAWEVAL_NOTES_URL}
