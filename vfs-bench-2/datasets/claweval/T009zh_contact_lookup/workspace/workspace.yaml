# T009zh_contact_lookup, on vfsbench_harbor's mirage environment (datasets/claweval/convert.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
fakes:
  claweval_contacts:
    fixture: fixtures/claweval_contacts.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9103
copy:
  /workspace: workspace/
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        curl:
          decision: deny
          reason: the services are reached through their tools
        wget:
          decision: deny
          reason: the services are reached through their tools
  clis:
    contacts:
      cli: contacts
      machine: in_process
      config:
        url: ${CLAWEVAL_CONTACTS_URL}
