# T138_restock_chain_check, on vfsbench_harbor's mirage environment (datasets/claweval/convert.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
fakes:
  claweval_scheduler:
    fixture: fixtures/claweval_scheduler.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9112
  claweval_config:
    fixture: fixtures/claweval_config.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9111
  claweval_inventory:
    fixture: fixtures/claweval_inventory.json
    epoch: '2026-04-03T09:00:00Z'
    ports:
    - 9108
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  clis:
    scheduler:
      cli: scheduler
      config:
        url: ${CLAWEVAL_SCHEDULER_URL}
    config:
      cli: config
      config:
        url: ${CLAWEVAL_CONFIG_URL}
    inventory:
      cli: inventory
      config:
        url: ${CLAWEVAL_INVENTORY_URL}
