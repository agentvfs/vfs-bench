# T163zh_quarterly_customer_review, on vfsbench_harbor's mirage environment (datasets/claweval/convert.py writes it).
#
# Each service is its kit fake at upstream's port, and its tools CLIs
# (workspace/tools.ts).
#
# Gmail and calendar are Mirage's gws fake: the /gmail and /calendar
# mounts and the gws CLI, at this trial's run of it, with upstream's
# fixtures under upstream's ids; gws-integ-token is the fake's own
# credential. Its SQLite is what the verifier reads them from.
fakes:
  claweval_contacts:
    fixture: fixtures/claweval_contacts.json
    epoch: '2026-03-26T09:00:00Z'
    ports:
    - 9103
  claweval_finance:
    fixture: fixtures/claweval_finance.json
    epoch: '2026-03-26T09:00:00Z'
    ports:
    - 9104
  claweval_rss:
    fixture: fixtures/claweval_rss.json
    epoch: '2026-03-26T09:00:00Z'
    ports:
    - 9109
  claweval_crm:
    fixture: fixtures/claweval_crm.json
    epoch: '2026-03-26T09:00:00Z'
    ports:
    - 9110
  gws:
    fixture: fixtures/gws.json
    epoch: '2026-03-26T09:00:00Z'
    state: /var/lib/mock-data/gws/gws.db
tools:
  file: tools.json
  dispatches: /var/lib/mock-data/claweval/dispatches.jsonl
workspace:
  profiles:
    default:
      commands:
        deny:
        - commands:
          - curl
          - wget
          reason: the services are reached through their tools
  mounts:
    /gmail:
      vfs: gmail
      mode: read
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
  clis:
    finance:
      cli: finance
      config:
        url: ${CLAWEVAL_FINANCE_URL}
    crm:
      cli: crm
      config:
        url: ${CLAWEVAL_CRM_URL}
    rss:
      cli: rss
      config:
        url: ${CLAWEVAL_RSS_URL}
    contacts:
      cli: contacts
      config:
        url: ${CLAWEVAL_CONTACTS_URL}
    gws:
      cli: gws
      config:
        accessToken: gws-integ-token
        apiBase: ${GWS_URL}
