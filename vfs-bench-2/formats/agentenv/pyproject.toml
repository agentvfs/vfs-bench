[project]
name = "vfsbench-agentenv"
version = "0.1.0"
description = "A vfs-bench-2 task's Mirage workspace as an agent-env environment"
requires-python = ">=3.12"
dependencies = ["agentenv-framework==0.9.1634", "httpx", "pyyaml"]

[project.entry-points."agent_env.env_providers"]
mirage = "vfsbench_agentenv.topology:MirageTopology"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
